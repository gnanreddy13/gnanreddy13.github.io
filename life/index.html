<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>slice of life · gnan reddy bobba</title>
  <meta name="description" content="the other half: places, lifting and the media i love">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ctext x='16' y='20' font-family='system-ui,sans-serif' font-size='22' font-weight='600' text-anchor='middle' fill='%23f2f2f0'%3Eg%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gnanreddy13.github.io/life/">
  <meta property="og:title" content="slice of life · gnan reddy bobba">
  <meta property="og:description" content="the other half: places, lifting and the media i love">
  <meta property="og:image" content="https://gnanreddy13.github.io/life/photos/hyderabad-banner.jpg">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="1125">
  <meta property="og:image:alt" content="A wide blue sky with clouds over green fields, Hyderabad">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="../fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <!-- the handwriting ("slice of life" under the name, the polaroids' captions): Caveat, served from here like Geist -->
  <link rel="preload" href="../fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>
  <!-- the home page's home.css gives the whole look (type, colours, links, the header, the clock); life.css only adds this
       page's own pieces. ?v= is replaced with the commit at every deploy, so visitors never get a stale copy -->
  <link rel="stylesheet" href="../home.css?v=1">
  <link rel="stylesheet" href="life.css?v=1">
  <script src="life.js?v=1" defer></script>
  <!-- everything after the intro is drawn from data.json by life.js; it starts downloading now, alongside the styles -->
  <link rel="preload" href="data.json" as="fetch" crossorigin>
</head>
<body>
  <main>
    <!-- the same header as the home page -->
    <section>
      <div class="who">
        <img src="../me.jpg" alt="" width="120" height="120">
        <div>
          <h1 class="bright name">gnan reddy bobba</h1>
          <p class="script">slice of life</p>
        </div>
        <div class="time">
          <p class="lcd" id="now" role="img" aria-label="local time in india">utc+5:30</p>
          <p>india · ist</p>
        </div>
      </div>
    </section>

    <section class="intro">
      <!-- one paragraph, like the home page's, which ends the other way round: "the rest is my slice of life" -->
      <p class="bright lede">this is my slice of life: places, lifting and the media i love. the rest is my <a href="../">&lt;coding side&gt;</a>.</p>
    </section>

    <!-- in the intro's order: places, lifting, then the stories, a section each -->
    <!-- places: a small grey card each, its photo with the name beneath; the card opens the album -->
    <section>
      <p class="label">places</p>
      <div class="pl" id="places"></div>
    </section>

    <!-- lifting: the past year as a graph, then the workout, the way home lists projects -->
    <section>
      <p class="label">lifting</p>
      <!-- the past year, like the home page's activity graph: a square a day, green on the days i went -->
      <div class="slide gym" id="gslide"><div class="graph" id="graph" role="img"></div></div>
      <div id="plan"></div>
    </section>

    <!-- the stories: the kinds (anime, manga, tv, cinema, games) as tabs in the labels' hand, and the picked kind's posters
         in one row underneath, like places: each uncropped and small with its title beneath, what's ongoing first.
         life.js draws them from data.json -->
    <section class="kind">
      <div class="tabs" id="tabs" role="tablist" aria-label="media"></div>
      <div class="pl" id="shelf" role="tabpanel"></div>
    </section>

    <section class="credit" id="credit">
      <!-- each source as its official logo, in its colour, like home's contact row: the name comes up in a bubble on hover
           (steam's logo is black, so off-white here, as home does for github) -->
      <p class="cap">posters from <span class="icons src"><a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer" aria-label="TMDB" data-n="TMDB"><i style="--icon: url(../icons/themoviedatabase.svg); --brand: #01B4E4"></i></a><a href="https://anilist.co/" target="_blank" rel="noreferrer" aria-label="AniList" data-n="AniList"><i style="--icon: url(../icons/anilist.svg); --brand: #02A9FF"></i></a><a href="https://store.steampowered.com/" target="_blank" rel="noreferrer" aria-label="Steam" data-n="Steam"><i style="--icon: url(../icons/steam.svg); --brand: #F2F2F0"></i></a></span></p>
    </section>
  </main>
</body>
</html>
