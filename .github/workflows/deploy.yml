name: deploy

# fetches fresh activity data, then publishes the site. nothing is committed back:
# the files in data/ are only a starting point, overwritten in the build
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST every night, so the graphs stay current
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                 # never two deploys at once
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: fetch activity data
        continue-on-error: true   # a failed fetch keeps the files from the repo, and the site still deploys
        run: node scripts/update-activity.mjs
        env:
          GH_USER: gnanreddy13
          LC_USER: gnanreddy13
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: stamp asset versions   # ?v= becomes the commit, so visitors never get a stale stylesheet or script
        run: sed -i -E "s/(home\.css|home\.js|life\.css|life\.js)\?v=[0-9a-z]+/\1?v=${GITHUB_SHA::7}/g" index.html 404.html life/index.html
      - name: stamp the resume   # ?v= becomes a hash of the pdf, so a new resume gets a new link and phones stop showing a cached copy
        run: sed -i -E "s/(resume\.pdf)\?v=[0-9a-z]+/\1?v=$(sha1sum gnan-reddy-bobba-resume.pdf | cut -c1-7)/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
