name: update-activity

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST every night
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:                 # never two runs pushing at once
  group: update-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: fetch activity data
        run: node scripts/update-activity.mjs
        env:
          GH_USER: gnanreddy13
          LC_USER: gnanreddy13
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "update activity data"
          git pull --rebase    # you may have pushed while the run was fetching
          git push
